[project]
name = "dogqoder"
version = "0.1.0"
description = "Persistent, observable Qoder workers for Codex"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qoder-agent-sdk==1.0.13",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_qoder: runs against the credentialed Qoder service",
]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
