[project]
name = "dogqoder"
version = "0.1.0"
description = "Persistent, observable Qoder workers for Codex"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "qoder-agent-sdk==1.0.13",
]

[project.scripts]
qworker = "qworker.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-jsonschema",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "qworker"

[tool.pytest.ini_options]
addopts = "-m 'not real_qoder'"
asyncio_mode = "auto"
markers = [
    "real_qoder: runs against the credentialed Qoder service",
]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
